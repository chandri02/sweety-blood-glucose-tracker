services:
  - type: web
    name: sweety-blood-glucose-tracker
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sweety-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: SESSION_EXPIRY_DAYS
        value: 7

databases:
  - name: sweety-db
    plan: free
    region: oregon
    databaseName: blood_glucose_tracker_db
    user: sweety_admin
